services:
  hubs:
    image: molecular-hubs/hubs-static-check:arm64
    restart: unless-stopped
    environment:
      turkeyCfg_base_assets_path: "https://assets.molecular-hubs-ardakonut.duckdns.org/hubs/"
      turkeyCfg_reticulum_server: "molecular-hubs-ardakonut.duckdns.org"
      turkeyCfg_hubs_server: "molecular-hubs-ardakonut.duckdns.org"
      turkeyCfg_cors_proxy_server: "cors.molecular-hubs-ardakonut.duckdns.org"
      turkeyCfg_shortlink_domain: "link.molecular-hubs-ardakonut.duckdns.org"
      turkeyCfg_non_cors_proxy_domains: "molecular-hubs-ardakonut.duckdns.org,assets.molecular-hubs-ardakonut.duckdns.org"
      turkeyCfg_postgrest_server: ""
      turkeyCfg_sentry_dsn: ""
      turkeyCfg_ga_tracking_id: ""
    volumes:
      - ${OCI_PUBLIC_CONFIG_DIR:?use_the_deployment_wrapper}/static-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/branding:/www/hubs/branding:ro

  spoke:
    image: molecular-hubs/spoke-static-check:arm64
    restart: unless-stopped
    environment:
      turkeyCfg_base_assets_path: "https://assets.molecular-hubs-ardakonut.duckdns.org/spoke/"
      turkeyCfg_reticulum_server: "molecular-hubs-ardakonut.duckdns.org"
      turkeyCfg_hubs_server: "molecular-hubs-ardakonut.duckdns.org"
      turkeyCfg_cors_proxy_server: "cors.molecular-hubs-ardakonut.duckdns.org"
      turkeyCfg_shortlink_domain: "link.molecular-hubs-ardakonut.duckdns.org"
      turkeyCfg_non_cors_proxy_domains: "molecular-hubs-ardakonut.duckdns.org,assets.molecular-hubs-ardakonut.duckdns.org"
      turkeyCfg_sentry_dsn: ""
      turkeyCfg_ga_tracking_id: ""
    volumes:
      - ${OCI_PUBLIC_CONFIG_DIR:?use_the_deployment_wrapper}/static-nginx.conf:/etc/nginx/conf.d/default.conf:ro
